name: 'Workflow Lens'
description: 'Inspect GitHub Actions workflows for dependencies, requested token permissions, secret references, and review hotspots.'
author: 'sreyasts'
branding:
  icon: 'eye'
  color: 'green'

inputs:
  workflow:
    description: 'Path to a workflow YAML file in the checked-out workspace'
    required: false
    default: '.github/workflows/ci.yml'
  format:
    description: 'Output format: markdown, json, or mermaid'
    required: false
    default: 'markdown'
  fail-on-high:
    description: 'Exit with code 1 if high-severity review hints are detected'
    required: false
    default: 'false'
  summary:
    description: 'Add a Markdown review report to the GitHub job summary; disable for sensitive workflow metadata'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run Workflow Lens
      shell: bash
      env:
        WORKFLOW_LENS_WORKFLOW: ${{ inputs.workflow }}
        WORKFLOW_LENS_FORMAT: ${{ inputs.format }}
        WORKFLOW_LENS_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
        WORKFLOW_LENS_SUMMARY: ${{ inputs.summary }}
      run: |
        case "$WORKFLOW_LENS_SUMMARY" in
          true|false) ;;
          *) echo "Workflow Lens summary must be true or false." >&2; exit 2 ;;
        esac
        workflow_path="$(node -e '
          const { realpathSync, statSync } = require("node:fs");
          const { isAbsolute, relative, resolve, sep } = require("node:path");
          const workspace = realpathSync(process.env.GITHUB_WORKSPACE);
          const target = realpathSync(resolve(workspace, process.env.WORKFLOW_LENS_WORKFLOW));
          const fromWorkspace = relative(workspace, target);
          if (!statSync(target).isFile() || fromWorkspace === ".." || fromWorkspace.startsWith(`..${sep}`) || isAbsolute(fromWorkspace)) {
            process.stderr.write("Workflow path must name a file inside the checked-out workspace.\n");
            process.exit(2);
          }
          process.stdout.write(target);
        ')"
        npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --no-audit --no-fund
        npm run build --prefix "$GITHUB_ACTION_PATH"

        args=("$workflow_path")
        case "$WORKFLOW_LENS_FORMAT" in
          markdown) ;;
          json) args+=(--json) ;;
          mermaid) args+=(--mermaid) ;;
          *) echo "Unsupported Workflow Lens format." >&2; exit 2 ;;
        esac
        if [ "$WORKFLOW_LENS_FAIL_ON_HIGH" = "true" ]; then
          args+=(--fail-on-high)
        fi
        node "$GITHUB_ACTION_PATH/scripts/action-report.ts" "${args[@]}"
