name: Release & Publish
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Match tag to package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_TAG="v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          if [[ "$RELEASE_TAG" != "$PACKAGE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_TAG." >&2
            exit 1
          fi
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            RELEASE_VERSION="${RELEASE_TAG#v}"
            NOTES_FILE="$(mktemp)"
            awk -v version="$RELEASE_VERSION" '
              $0 ~ "^## " version "([[:space:]]|$)" { found = 1; print; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > "$NOTES_FILE"
            gh release create "$RELEASE_TAG" --title "Workflow Lens $RELEASE_TAG" --notes-file "$NOTES_FILE"
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is unset; skipping npm publication."
            exit 0
          fi
          npm publish --access public
